<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2"/>
  
  <!-- Four quadrants representing Four Core Literacies -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#262b39" stroke-width="6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(230, 162, 74, 0.4)" stroke-width="5" stroke-dasharray="8 6"/>
  
  <!-- Literacy Accent Nodes -->
  <!-- Top: Health (Emerald) -->
  <circle cx="256" cy="96" r="14" fill="#10b981"/>
  <!-- Right: Care (Cyan) -->
  <circle cx="416" cy="256" r="14" fill="#06b6d4"/>
  <!-- Bottom: Innovation (Amber) -->
  <circle cx="256" cy="416" r="14" fill="#f59e0b"/>
  <!-- Left: Excellence (Violet) -->
  <circle cx="96" cy="256" r="14" fill="#8b5cf6"/>

  <!-- Radar sweep / pulse lines -->
  <path d="M176 336 a110 110 0 0 1 0 -160" fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M336 176 a110 110 0 0 1 0 160" fill="none" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Center Core -->
  <circle cx="256" cy="256" r="38" fill="url(#amberGrad)"/>
  <circle cx="256" cy="256" r="18" fill="#090a0f"/>
</svg>
