name: Build and Release Flutter APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Analyze Dart codebase
        run: |
          cd mobile
          flutter analyze --no-fatal-infos

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Archive build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "Target Release Tag: $TAG_NAME"
          gh release upload "$TAG_NAME" mobile/build/app/outputs/flutter-apk/app-release.apk --clobber
